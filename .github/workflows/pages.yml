# Publica la maqueta en GitHub Pages (ambiente de pruebas) en cada push a main.
# URL: https://marinagoldpe.github.io/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez. No se cancela la que está en curso (recomendación de GitHub):
# las que llegan mientras tanto esperan y se publica la última.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (exportación estática)
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Dominio del sitio para las URL absolutas de og:image y twitter:image
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
